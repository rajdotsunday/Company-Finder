/* =========================
   NORMALIZE FUNCTION
========================= */
function normalizeCompanyName(name){

    return name.toString()
    .replace(/[^a-zA-Z0-9 ]/g,' ')
    .replace(/\bPRIVATE\b/gi,'PVT')
    .replace(/\bLIMITED\b/gi,'LTD')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

/* =========================
   INDEXEDDB SETUP
========================= */

let db;

const DB_NAME = "ExcelDB";
const STORE_NAME = "files";

function openDB(){

    return new Promise((resolve, reject) => {

        let request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = function(e){

            db = e.target.result;

            if(!db.objectStoreNames.contains(STORE_NAME)){

                db.createObjectStore(STORE_NAME);
            }
        };

        request.onsuccess = function(e){

            db = e.target.result;
            resolve(db);
        };

        request.onerror = function(err){

            reject(err);
        };
    });
}

function saveExcelToDB(file){

        let tx = db.transaction(STORE_NAME, "readwrite");

        store.put(file, "excelFile");

        tx.oncomplete = () => resolve();

        tx.onerror = err => reject(err);
    });
}

     async function loadExcelData(file){

    return new Promise((resolve,reject)=>{

        let reader = new FileReader();

        reader.onload = function(event){

            try{

                let data = new Uint8Array(event.target.result);

                let workbook = XLSX.read(data,{type:'array'});

                allData = [];
                companyMap.clear();

                workbook.SheetNames.forEach(sheetName=>{

                    let sheet = workbook.Sheets[sheetName];

                    let json = XLSX.utils.sheet_to_json(sheet);

                    json.forEach(row=>{

                        let company = row["COMPANY NAME"];
                        let category = row["Category"];

                        if(company && category){

                            let item = {
                                bank: sheetName,
                                company: company.toString().trim(),
                                category: category.toString().trim()
                            };

                            allData.push(item);

                            let key = normalizeCompanyName(item.company);

                            if(!companyMap.has(key)){
                                companyMap.set(key,[]);
                            }

                            companyMap.get(key).push(item);
                        }
                    });
                });

                excelLoaded = true;
                document.getElementById("searchInput").disabled = false;

                resolve();

            }catch(err){
                reject(err);
            }
        };

        reader.onerror = reject;

        reader.readAsArrayBuffer(file);
    });
}

            .innerText = "";

            .style.display = "none";

        }

        let matches = [];

        for(let [key,val] of companyMap){

            if(key.includes(search)){

        }

            `<div class="suggestion-item">
            No Record Found
            </div>`;

            return;
        }

        suggestions.innerHTML = matches.map(c =>

        `<div class="suggestion-item">${c}</div>`

        ).join("");

    },100);
});

let searchHistory =
JSON.parse(localStorage.getItem("companyHistory")) || [];

function saveToHistory(company){

    company = company.trim();

    // Duplicate remove
    searchHistory = searchHistory.filter(
        item => item.toLowerCase() !== company.toLowerCase()
    );

    // New company top par
    searchHistory.unshift(company);

    // Sirf latest 3
searchHistory = searchHistory.slice(0,10);
    localStorage.setItem(
        "companyHistory",
        JSON.stringify(searchHistory)
    );
}

function calculateEMI(){

let P = parseFloat(
document.getElementById("emiAmount").value
);

let annualRate = parseFloat(
document.getElementById("emiRate").value
);

let N = parseInt(
document.getElementById("emiTenure").value
);

if(!P || !annualRate || !N){

document.getElementById("emiResult").innerHTML =
"⚠ Please fill all fields";

return;
}

let R = annualRate / 12 / 100;

let EMI =
(P * R * Math.pow(1+R,N))
/
(Math.pow(1+R,N)-1);

EMI = EMI.toFixed(0);

document.getElementById("emiResult").innerHTML =
"✅ EMI: ₹" +
Number(EMI).toLocaleString("en-IN");
}

/* ===========================
   PINCODE MODULE - AUTO MULTI BANK
   Har Excel sheet = ek bank
   Future me nayi sheet add karoge to automatically read hogi.
=========================== */

function normalizePincodeValue(value){
    if(value === null || value === undefined) return "";

    let s = String(value).trim();

    // Excel numeric values kabhi 110092.0 aa sakte hain
    if(/^\d+\.0+$/.test(s)) s = s.split('.')[0];

    // Sirf valid 6 digit Indian pincode accept karo
    return /^\d{6}$/.test(s) ? s : "";
}

function findPincodeInRow(row){
    const keys = Object.keys(row);

    // Pehle proper pincode column ko priority do
    const pinKey = keys.find(k => {
        const n = String(k)
            .toLowerCase()
            .replace(/[_\-]+/g," ")
            .replace(/\s+/g," ")
            .trim();

        return [
            "pincode",
            "pin code",
            "pin",
            "postal code",
            "postalcode",
            "pin_code"
        ].includes(n);
    });

    if(pinKey){
        const pin = normalizePincodeValue(row[pinKey]);
        if(pin) return pin;
    }

    // Different bank sheets me column alag ho sakta hai.
    // Isliye row ke kisi bhi cell me 6-digit pincode dhundo.
    for(const key of keys){
        const pin = normalizePincodeValue(row[key]);
        if(pin) return pin;
    }

    return "";
}

/* ===========================
   LOAD PINCODE EXCEL
=========================== */

async function loadPincodeExcel(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onprogress = function(e){
            if(e.lengthComputable){
                const percent = Math.round((e.loaded / e.total) * 100);
                if(typeof progressBar !== "undefined") progressBar.style.width = percent + "%";
                if(typeof progressText !== "undefined") progressText.innerText =
                    "Reading Pincode Excel " + percent + "%";
            }
        };

        reader.onload = function(event){
            try{

                const workbook = XLSX.read(
                    new Uint8Array(event.target.result),
                    {type:"array", cellDates:false}
                );

                pincodeData = [];
                pincodeMap.clear();

                // Har sheet automatically bank hai.
                pincodeBanks = workbook.SheetNames.map(name => String(name).trim());

                workbook.SheetNames.forEach(sheetName => {

                    const sheet = workbook.Sheets[sheetName];

                    // raw:false se formatted Excel values bhi preserve karne ki koshish hoti hai
                    const json = XLSX.utils.sheet_to_json(sheet, {
                        defval: "",
                        raw: false
                    });

                    json.forEach(row => {

                        const pin = findPincodeInRow(row);
                        if(!pin) return;

                        const item = {
                            pincode: pin,
                            city: String(row["City"] ?? row["City__c"] ?? "").trim(),
                            state: String(row["State"] ?? row["State__c"] ?? "").trim(),
                            branch: String(row["Branch"] ?? row["set Branch Pinco"] ?? "").trim(),
                            distance: String(row["Distance"] ?? "").trim(),
                            bank: String(sheetName).trim()
                        };

                        pincodeData.push(item);

                        // Same pincode multiple banks me ho sakta hai.
                        if(!pincodeMap.has(pin)){
                            pincodeMap.set(pin, []);
                        }

                        pincodeMap.get(pin).push(item);
                    });
                });

                console.log("Pincode sheets/banks:", pincodeBanks);
                console.log("Total pincode rows:", pincodeData.length);

                if(typeof progressBar !== "undefined") progressBar.style.width = "100%";
                if(typeof progressText !== "undefined") progressText.innerText = "Pincode Excel Loaded";

                resolve();

            }catch(err){
                reject(err);
            }
        };

        reader.onerror = function(){
            reject(new Error("Unable to read Pincode Excel"));
        };

        reader.readAsArrayBuffer(file);
    });
}

const oldSearch = document.getElementById("searchInput");

oldSearch.addEventListener("input", function(){

    const value = this.value.trim();

    // Sirf numeric search pincode ke liye
    if(!/^\d+$/.test(value)) return;
    if(!pincodeLoaded) return;

    suggestions.innerHTML = "";

    if(value.length < 2) return;

    let html = "";
    let count = 0;
    const seen = new Set();

    for(const item of pincodeData){

        if(item.pincode.startsWith(value) && !seen.has(item.pincode)){

            seen.add(item.pincode);

            html += `
            <div class="suggestion-item pin-item" data-pin="${item.pincode}">
                ${item.pincode} - ${item.city || item.bank}
            </div>`;

            count++;
            if(count >= 10) break;
        }
    }

    if(count === 0){
        suggestions.innerHTML = `
        <div class="suggestion-item">No Pincode Found</div>`;
        return;
    }

    suggestions.innerHTML = html;
});

        ? pincodeBanks
        : [...new Set(pincodeData.map(x => x.bank))];

    const foundByBank = new Map();
    data.forEach(row => {

    });

    let html = "";

function updateClock(){

const now = new Date();

const sec = now.getSeconds();
const min = now.getMinutes();
const hr = now.getHours() % 12;

// Analog Clock
const secDeg = sec * 6;
const minDeg = min * 6 + sec * 0.1;
const hrDeg = hr * 30 + min * 0.5;

document.getElementById("second").style.transform =
`translateX(-50%) rotate(${secDeg}deg)`;

document.getElementById("minute").style.transform =
`translateX(-50%) rotate(${minDeg}deg)`;

document.getElementById("hour").style.transform =
`translateX(-50%) rotate(${hrDeg}deg)`;

// Digital Time
let hour24 = now.getHours();
let hour12 = hour24 % 12 || 12;
let ampm = hour24 >= 12 ? "PM" : "AM";

document.getElementById("digitalClock").innerHTML =
`${String(hour12).padStart(2,'0')}:${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')} ${ampm}`;

// Date
const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

document.getElementById("clockDate").innerHTML =
`${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

}

updateClock();
setInterval(updateClock,1000);

</script>
